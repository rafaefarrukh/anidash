name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  # Opt-in: set the repository variable PUBLISH_PYPI=true once PyPI trusted publishing is configured.
  pypi:
    needs: python
    if: vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install . pyinstaller
      - run: python packaging/windows/make_version.py
      - run: pyinstaller packaging/windows/anidash.spec --noconfirm --distpath dist --workpath build
      - name: Selftest the frozen exe
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "selftest.json"
          $p = Start-Process dist/anidash/anidash.exe -ArgumentList "selftest",$out -Wait -PassThru
          Get-Content $out
          if ($p.ExitCode -ne 0) { exit 1 }
          $r = Get-Content $out -Raw | ConvertFrom-Json
          if ($r.checks.window.detail -ne "winforms/edgechromium") { Write-Error "window backend is not WebView2"; exit 1 }
      - name: Installer
        shell: pwsh
        run: |
          Invoke-WebRequest "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile packaging/windows/MicrosoftEdgeWebview2Setup.exe
          $sig = Get-AuthenticodeSignature packaging/windows/MicrosoftEdgeWebview2Setup.exe
          if ($sig.Status -ne "Valid" -or $sig.SignerCertificate.Subject -notmatch "O=Microsoft Corporation") { Write-Error "bootstrapper signature: $($sig.Status) $($sig.SignerCertificate.Subject)"; exit 1 }
          $v = python packaging/windows/make_version.py --print
          $n = python packaging/windows/make_version.py --print-num
          choco install innosetup -y --no-progress
          $iscc = (Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe", "$env:ProgramFiles\Inno Setup *\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          "ISCC: $iscc"
          & $iscc "/DAppVersion=$v" "/DAppNumVersion=$n" packaging\windows\anidash.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/anidash-*-setup.exe

  # Doesn't wait for PyPI: the release goes out even when publishing there is off or fails.
  publish:
    needs: [python, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: SHA256SUMS.txt
        working-directory: out
        run: sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          body: |
            Windows: the `anidash-…-setup.exe` asset below (per-user, no admin). Linux: see the README (pipx or AUR). Verify downloads with `SHA256SUMS.txt`.
            [Code signing policy](https://github.com/rafaefarrukh/anidash/blob/main/docs/code-signing-policy.md)
          prerelease: ${{ contains(github.ref_name, 'rc') }}
