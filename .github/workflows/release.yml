name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write   # PyPI trusted publishing

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install . pyinstaller
      - run: python packaging/windows/make_version.py
      - run: pyinstaller packaging/windows/anidash.spec --noconfirm --distpath dist --workpath build
      - name: Installer
        shell: pwsh
        run: |
          $v = python packaging/windows/make_version.py --print
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" packaging\windows\anidash.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/anidash-*-setup.exe

  publish:
    needs: [python, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
