name: CI
on:
  push:
    branches: [main, v2, "claude/**"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: qbittorrent-nox for the integration test
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q qbittorrent-nox
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  windows-build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install . pyinstaller
      - run: python packaging/windows/make_version.py
      - run: pyinstaller packaging/windows/anidash.spec --noconfirm --distpath dist --workpath build
      - name: Smoke test the frozen exe
        shell: pwsh
        run: |
          $p = Start-Process dist/anidash/anidash.exe -ArgumentList "service","--no-tray" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep -Milliseconds 500
            try { $h = Invoke-RestMethod http://127.0.0.1:8787/api/health; if ($h.app -eq "anidash") { $ok = $true; break } } catch {}
          }
          Stop-Process -Id $p.Id -Force
          if (-not $ok) { Get-Content "$env:LOCALAPPDATA/anidash/Logs/anidash.log" -ErrorAction SilentlyContinue; exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: anidash-windows-folder
          path: dist/anidash
