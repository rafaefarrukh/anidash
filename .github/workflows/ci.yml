name: CI
on:
  push:
    branches: [main, v2, "claude/**"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install "ruff==0.17.3"
      - run: ruff check src tests

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: qbittorrent-nox for the integration test
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q qbittorrent-nox
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  windows-build:
    needs: [lint, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install . pyinstaller
      - run: python packaging/windows/make_version.py
      - run: pyinstaller packaging/windows/anidash.spec --noconfirm --distpath dist --workpath build
      - name: Selftest the frozen exe
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "selftest.json"
          $p = Start-Process dist/anidash/anidash.exe -ArgumentList "selftest",$out -Wait -PassThru
          Get-Content $out
          if ($p.ExitCode -ne 0) { exit 1 }
          $r = Get-Content $out -Raw | ConvertFrom-Json
          if ($r.checks.window.detail -ne "winforms/edgechromium") { Write-Error "window backend is not WebView2"; exit 1 }
      - name: Smoke test the frozen exe
        shell: pwsh
        run: |
          $p = Start-Process dist/anidash/anidash.exe -ArgumentList "service","--no-tray" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep -Milliseconds 500
            try { $h = Invoke-RestMethod http://127.0.0.1:8787/api/health; if ($h.app -eq "anidash") { $ok = $true; break } } catch {}
          }
          Stop-Process -Id $p.Id -Force
          if (-not $ok) { Get-Content "$env:LOCALAPPDATA/anidash/Logs/anidash.log" -ErrorAction SilentlyContinue; exit 1 }
      - name: Build the installer
        shell: pwsh
        run: |
          # Evergreen WebView2 bootstrapper; the link is Microsoft's ("Get the Link" on the WebView2 download page)
          Invoke-WebRequest "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile packaging/windows/MicrosoftEdgeWebview2Setup.exe
          $sig = Get-AuthenticodeSignature packaging/windows/MicrosoftEdgeWebview2Setup.exe
          if ($sig.Status -ne "Valid" -or $sig.SignerCertificate.Subject -notmatch "O=Microsoft Corporation") { Write-Error "bootstrapper signature: $($sig.Status) $($sig.SignerCertificate.Subject)"; exit 1 }
          choco install innosetup -y --no-progress
          $v = python packaging/windows/make_version.py --print
          $n = python packaging/windows/make_version.py --print-num
          $iscc = (Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe", "$env:ProgramFiles\Inno Setup *\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          "ISCC: $iscc"
          & $iscc "/DAppVersion=$v" "/DAppNumVersion=$n" packaging\windows\anidash.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Install, upgrade and uninstall silently
        shell: pwsh
        run: |
          $v = python packaging/windows/make_version.py --print
          ./packaging/windows/ci_installer_test.ps1 -Setup (Resolve-Path "dist/anidash-$v-setup.exe") -Version $v
      - uses: actions/upload-artifact@v4
        with:
          name: anidash-windows-folder
          path: dist/anidash
      - uses: actions/upload-artifact@v4
        with:
          name: anidash-windows-installer
          path: dist/anidash-*-setup.exe
